# Lab fork: on every push to develop, build the WebUI bundle and the desktop apps (Windows,
# Linux, macOS; x64 and arm64) and publish them as the rolling pre-release "lab-develop".
#
# Web bundle on a lab server (no local Node toolchain needed):
#   gh release download lab-develop -R b-re-w/backend.ai-webui -p 'backend.ai-webui-bundle-*.zip'
#   unzip -o backend.ai-webui-bundle-*.zip -d <backend.ai>/src/ai/backend/web/static
# Keep the server's own config.toml; the bundle ships config.toml.sample only.
#
# The macOS apps are signed ad hoc (the fork has no Apple Developer ID): on first launch
# macOS shows "unidentified developer" until the user allows the app in System Settings >
# Privacy & Security ("Open Anyway").
#
# Versioned release for auto-update: push a tag v<webui>-lab.<n> (e.g. v26.8.1-lab.1) or run
# this workflow by hand with that version. The build then carries that version, adds the
# Windows installer with latest.yml, and publishes it as a normal (latest) release that the
# desktop app's update check reads. Plain develop pushes keep updating lab-develop only.
name: Lab web bundle
on:
  push:
    branches: [develop]
    tags: ['v*-lab.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v (e.g. 26.8.1-lab.1). Empty: rolling lab-develop build.'
        required: false
        default: ''

concurrency:
  group: lab-web-bundle-${{ github.ref_type }}-${{ inputs.version || 'rolling' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && !inputs.version }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versiontag counts commits

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-lab\.[0-9]+$'; then
            echo "::error::Version must look like 26.8.1-lab.1, got '$v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set release version
        if: steps.version.outputs.version != ''
        run: |
          npm pkg set version="${{ steps.version.outputs.version }}"
          (cd electron-app && npm pkg set version="${{ steps.version.outputs.version }}")

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: make bundle

      - uses: actions/upload-artifact@v5
        with:
          name: web-bundle
          path: app/backend.ai-webui-bundle-*.zip
          retention-days: 30

      # The desktop jobs package this same build.
      - uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: |
            build/web/
            src/wsproxy/dist/
          retention-days: 1
          compression-level: 3

  desktop:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Set release version
        if: needs.web.outputs.version != ''
        run: |
          npm pkg set version="${{ needs.web.outputs.version }}"
          (cd electron-app && npm pkg set version="${{ needs.web.outputs.version }}")

      - uses: actions/download-artifact@v8
        with:
          name: web-build

      - run: make dep_electron

      - name: Compile local proxies
        run: |
          make compile_localproxy os=win arch=x64 local_proxy_postfix=.exe &
          make compile_localproxy os=win arch=arm64 local_proxy_postfix=.exe &
          make compile_localproxy os=linux arch=x64 local_proxy_postfix= &
          make compile_localproxy os=linux arch=arm64 local_proxy_postfix= &
          wait

      - name: Package Windows and Linux apps
        run: |
          make win_x64
          make win_arm64
          make linux_x64
          make linux_arm64

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-win-linux
          path: app/backend.ai-desktop-*.zip
          retention-days: 30

  mac:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Set release version
        if: needs.web.outputs.version != ''
        run: |
          npm pkg set version="${{ needs.web.outputs.version }}"
          (cd electron-app && npm pkg set version="${{ needs.web.outputs.version }}")

      - uses: actions/download-artifact@v8
        with:
          name: web-build

      - run: make dep_electron

      - name: Compile local proxies
        run: |
          make compile_localproxy os=macos arch=x64 local_proxy_postfix= &
          make compile_localproxy os=macos arch=arm64 local_proxy_postfix= &
          wait

      - name: Package macOS apps (ad hoc signed)
        env:
          BAI_APP_ADHOC_SIGN: '1'
        run: |
          make mac_x64
          make mac_arm64

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-mac
          path: app/backend.ai-desktop-*.dmg
          retention-days: 30

  # Windows x64 installer for in-place updates, built from the packaged app. NSIS builds
  # need Windows tools, so this runs on a Windows runner.
  windows-installer:
    needs: [web, desktop]
    if: needs.web.outputs.version != ''
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'

      - uses: actions/download-artifact@v8
        with:
          name: desktop-win-linux
          path: zips

      - name: Build NSIS installer
        env:
          VERSION: ${{ needs.web.outputs.version }}
        run: |
          mkdir -p pre proj/manifest
          7z x -y -opre "zips/backend.ai-desktop-$VERSION-win-x64.zip" > /dev/null
          cp electron-app/package.json proj/
          (cd proj && npm pkg set version="$VERSION")
          cp manifest/backend-ai.ico proj/manifest/
          electron_version=$(node -p "require('./package.json').devDependencies.electron.replace(/^[^0-9]*/, '')")
          npx --yes electron-builder@26.15.3 --win nsis --x64 \
            --prepackaged "$PWD/pre/Backend.AI Desktop-win32-x64" \
            --projectDir "$PWD/proj" --config "$PWD/electron-builder.lab.yml" \
            -c.electronVersion="$electron_version" \
            -c.directories.output="$PWD/nsis" --publish never
          ls -l nsis

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-win-installer
          path: |
            nsis/*-setup.exe
            nsis/*-setup.exe.blockmap
            nsis/latest.yml
          retention-days: 30

  release:
    needs: [web, desktop, mac, windows-installer]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.desktop.result == 'success' && needs.mac.result == 'success' && (needs.windows-installer.result == 'success' || needs.windows-installer.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish versioned release
        if: needs.web.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.web.outputs.version }}
        run: |
          ls -l dist
          tag="v$VERSION"
          notes="Lab release $tag from ${GITHUB_SHA::9}, built $(date -u +%Y-%m-%dT%H:%MZ)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease=false --latest --notes "$notes"
          else
            # A tag push already made the tag: point the release at it instead of passing a
            # target commit (GITHUB_TOKEN got 403 creating a release with --target there).
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              gh release create "$tag" --verify-tag --title "$tag" --latest --notes "$notes"
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --latest --notes "$notes"
            fi
          fi
          gh release upload "$tag" dist/*.zip dist/*.dmg dist/*-setup.exe dist/*-setup.exe.blockmap dist/latest.yml --clobber

      - name: Publish rolling pre-release lab-develop
        if: needs.web.outputs.version == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          notes="develop ${GITHUB_SHA::9} built $(date -u +%Y-%m-%dT%H:%MZ)"
          if gh release view lab-develop >/dev/null 2>&1; then
            gh release edit lab-develop --prerelease --notes "$notes"
          else
            gh release create lab-develop --prerelease --target "$GITHUB_SHA" --title "Lab develop build" --notes "$notes"
          fi
          for old in $(gh release view lab-develop --json assets -q '.assets[].name'); do
            gh release delete-asset lab-develop "$old" --yes
          done
          gh release upload lab-develop dist/*.zip dist/*.dmg --clobber
